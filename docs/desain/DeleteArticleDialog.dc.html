<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono&display=swap"><style>body{margin:0;background:#f3f2f2;color:#201f1d;font-family:Lora,serif}a{color:#7d5411}a:hover{color:#5a3b0a}button{font:inherit}@keyframes qlFade{from{opacity:0}to{opacity:1}}@keyframes qlPop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}</style></helmet>
<div data-screen-label="Popup Delete Article" style="position:relative;width:100%;height:100%;min-height:844px;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;font-family:Lora,serif;color:#201f1d;overflow:hidden">
  <div onClick="{{ close }}" style="position:absolute;inset:0;background:rgba(20,19,18,.45);animation:qlFade .2s ease-out"></div>
  <div role="alertdialog" style="position:relative;width:100%;max-width:320px;background:#f3f2f2;border-radius:8px;padding:24px 22px 14px;box-shadow:0 12px 32px rgba(45,43,43,.26);animation:qlPop .22s ease-out">
    <h2 style="margin:0 0 10px;font:600 24px/1.15 'Cormorant Garamond',serif">Hapus artikel ini?</h2>
    <p style="margin:0 0 6px;font:italic 400 14px/1.45 Lora,serif;color:#444141">“{{ title }}”</p>
    <p style="margin:0;font:400 14px/1.55 Lora,serif;color:#605d5d;text-wrap:pretty">Semua konten yang sudah diunduh akan ikut terhapus, termasuk checkpoint.</p>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
      <button onClick="{{ close }}" style="height:44px;padding:0 16px;border:none;background:transparent;color:#605d5d;font:600 14px Lora,serif;border-radius:4px;cursor:pointer" style-hover="background:#eae9e9">Batal</button>
      <button onClick="{{ confirm }}" style="height:44px;padding:0 18px;border:1px solid #9e3b2c;background:transparent;color:#9e3b2c;font:600 14px Lora,serif;border-radius:4px;cursor:pointer" style-hover="background:#f6e6e2">Hapus</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;articleTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Master &amp; Skill List&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onConfirm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      title: p.articleTitle ?? 'Master & Skill List',
      confirm: () => p.onConfirm && p.onConfirm(),
      close: () => p.onClose && p.onClose()
    };
  }
}
</script>
</body>
</html>
