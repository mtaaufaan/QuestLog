<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono&display=swap"><style>body{margin:0;background:#f3f2f2;color:#201f1d;font-family:Lora,serif}a{color:#7d5411}a:hover{color:#5a3b0a}button{font:inherit}@keyframes qlFade{from{opacity:0}to{opacity:1}}@keyframes qlSheet{from{transform:translateY(100%)}to{transform:none}}</style></helmet>
<div data-screen-label="Popup Article Actions" style="position:relative;width:100%;height:100%;min-height:844px;display:flex;flex-direction:column;justify-content:flex-end;font-family:Lora,serif;color:#201f1d;overflow:hidden">
  <div onClick="{{ close }}" style="position:absolute;inset:0;background:rgba(20,19,18,.45);animation:qlFade .2s ease-out"></div>
  <div style="position:relative;background:#f3f2f2;border-radius:12px 12px 0 0;padding:10px 12px 22px;box-shadow:0 -12px 32px rgba(45,43,43,.22);animation:qlSheet .28s cubic-bezier(.2,.8,.2,1)">
    <div style="width:36px;height:4px;border-radius:2px;background:#bab6b6;margin:0 auto 18px"></div>
    <div style="padding:0 12px 14px;border-bottom:1px solid rgba(32,31,29,.16);display:flex;flex-direction:column;gap:4px">
      <span style="font:600 10.5px/1 Lora,serif;letter-spacing:.12em;text-transform:uppercase;color:#7d5411">{{ gameName }}</span>
      <h2 style="margin:0;font:600 22px/1.2 'Cormorant Garamond',serif;text-wrap:pretty">{{ title }}</h2>
      <span style="font:400 13px/1.4 Lora,serif;color:#605d5d;font-variant-numeric:tabular-nums">{{ meta }}</span>
    </div>
    <div style="display:flex;flex-direction:column;padding-top:6px">
      <sc-if value="{{ hasCheckpoint }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ doResume }}" style="display:flex;align-items:center;gap:16px;height:52px;padding:0 12px;border:none;background:transparent;color:inherit;border-radius:4px;cursor:pointer;text-align:left" style-hover="background:#eae9e9">
          <svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:#a06f24;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          <span style="font:400 15px Lora,serif">Lanjutkan dari checkpoint</span>
        </button>
      </sc-if>
      <sc-if value="{{ isReady }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ doOpen }}" style="display:flex;align-items:center;gap:16px;height:52px;padding:0 12px;border:none;background:transparent;color:inherit;border-radius:4px;cursor:pointer;text-align:left" style-hover="background:#eae9e9">
          <svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:#605d5d;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          <span style="font:400 15px Lora,serif">Buka artikel</span>
        </button>
      </sc-if>
      <button onClick="{{ doAppend }}" style="display:flex;align-items:center;gap:16px;height:52px;padding:0 12px;border:none;background:transparent;color:inherit;border-radius:4px;cursor:pointer;text-align:left" style-hover="background:#eae9e9">
        <svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:#605d5d;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path><path d="M12 7v6"></path><path d="M9 10h6"></path></svg>
        <span style="display:flex;flex-direction:column;gap:1px"><span style="font:400 15px Lora,serif">Tambah halaman</span><span style="font:400 12px Lora,serif;color:#7d7979">Ditambahkan di akhir artikel</span></span>
      </button>
      <div style="height:1px;background:rgba(32,31,29,.12);margin:6px 12px"></div>
      <button onClick="{{ doDelete }}" style="display:flex;align-items:center;gap:16px;height:52px;padding:0 12px;border:none;background:transparent;color:#9e3b2c;border-radius:4px;cursor:pointer;text-align:left" style-hover="background:#f6e6e2">
        <svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:#9e3b2c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
        <span style="font:400 15px Lora,serif">Hapus artikel</span>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;article&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Article&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k:'resume'|'open'|'append'|'delete')=&gt;void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const a = p.article || { title: 'Walkthrough Lengkap — Disc 1', gameName: 'Dragon Quest VII', status: 'READY', pages: [1, 2, 3, 4, 5].map(() => ({ status: 'DONE' })), checkpointNodeId: 302 };
    const pages = a.pages || [];
    const done = pages.filter(x => x.status === 'DONE').length;
    const act = k => () => p.onAction && p.onAction(k);
    return {
      title: a.title, gameName: a.gameName,
      meta: done + ' dari ' + pages.length + ' halaman tersimpan',
      hasCheckpoint: !!a.checkpointNodeId && a.status === 'READY',
      isReady: a.status === 'READY',
      doResume: act('resume'), doOpen: act('open'), doAppend: act('append'), doDelete: act('delete'),
      close: () => p.onClose && p.onClose()
    };
  }
}
</script>
</body>
</html>
