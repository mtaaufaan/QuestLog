<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono&display=swap"><style>body{margin:0;background:#f3f2f2;color:#201f1d;font-family:Lora,serif}a{color:#7d5411}a:hover{color:#5a3b0a}button{font:inherit}@keyframes qlFade{from{opacity:0}to{opacity:1}}@keyframes qlSheet{from{transform:translateY(100%)}to{transform:none}}</style></helmet>
<div data-screen-label="Popup Game Filter" style="position:relative;width:100%;height:100%;min-height:844px;display:flex;flex-direction:column;justify-content:flex-end;font-family:Lora,serif;color:#201f1d;overflow:hidden">
  <div onClick="{{ close }}" style="position:absolute;inset:0;background:rgba(20,19,18,.45);animation:qlFade .2s ease-out"></div>
  <div style="position:relative;background:#f3f2f2;border-radius:12px 12px 0 0;padding:10px 12px 22px;box-shadow:0 -12px 32px rgba(45,43,43,.22);animation:qlSheet .28s cubic-bezier(.2,.8,.2,1)">
    <div style="width:36px;height:4px;border-radius:2px;background:#bab6b6;margin:0 auto 18px"></div>
    <h2 style="margin:0;padding:0 12px 12px;font:600 24px/1.15 'Cormorant Garamond',serif;border-bottom:1px solid rgba(32,31,29,.16)">Filter per game</h2>
    <div role="radiogroup" style="display:flex;flex-direction:column;padding-top:6px">
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{ o.active }}" onClick="{{ o.pick }}" style="display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border:none;background:transparent;color:inherit;border-radius:4px;cursor:pointer;text-align:left" style-hover="background:#eae9e9">
          <span style="flex:none;width:20px;height:20px;border-radius:10px;border:1px solid {{ o.ring }};display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:5px;background:{{ o.dot }}"></span></span>
          <span style="flex:1;font:400 15px/1.3 Lora,serif">{{ o.name }}</span>
          <span style="font:400 13px Lora,serif;color:#7d7979;font-variant-numeric:tabular-nums">{{ o.count }}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;games&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:number,name:string,count:number}[]&quot;},&quot;selectedId&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number|null&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:number|null)=&gt;void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { sel: null };
  renderVals() {
    const p = this.props;
    const games = p.games || [{ id: 1, name: 'Dragon Quest VII', count: 3 }, { id: 2, name: 'Breath Of Fire III', count: 2 }];
    const sel = p.selectedId !== undefined ? p.selectedId : this.state.sel;
    const total = games.reduce((s, g) => s + (g.count || 0), 0);
    const pick = id => () => { p.onSelect ? p.onSelect(id) : this.setState({ sel: id }); };
    const mk = (id, name, count) => ({ name, count, active: sel === id, ring: sel === id ? '#b68235' : '#9b9797', dot: sel === id ? '#b68235' : 'transparent', pick: pick(id) });
    return {
      options: [mk(null, 'Semua Game', total), ...games.map(g => mk(g.id, g.name, g.count))],
      close: () => p.onClose && p.onClose()
    };
  }
}
</script>
</body>
</html>
