<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono&display=swap"><style>body{margin:0;background:#f3f2f2;color:#201f1d;font-family:Lora,serif}a{color:#7d5411}a:hover{color:#5a3b0a}button,input{font:inherit}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}input::placeholder{color:#9b9797}@keyframes qlPulse{0%,100%{opacity:1}50%{opacity:.2}}@keyframes qlUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes qlBar{from{background-position:0 0}to{background-position:24px 0}}</style></helmet>
<div data-screen-label="S1 Article List" style="position:relative;width:100%;height:100%;min-height:844px;display:flex;flex-direction:column;background:#f3f2f2;color:#201f1d;font-family:Lora,serif;overflow:hidden">
  <div style="height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:600 13px system-ui,sans-serif;color:#201f1d">
    <span>9:41</span>
    <span style="display:flex;gap:5px;align-items:center"><span style="width:14px;height:9px;border:1px solid #444141;border-radius:2px"></span><span style="width:4px;height:4px;border-radius:2px;background:#444141"></span></span>
  </div>
  <header style="flex:none;padding:14px 20px 0;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <h1 style="margin:0;font:500 38px/1 'Cormorant Garamond',serif;letter-spacing:-.02em">QuestLog</h1>
        <span style="font:italic 400 13px/1.3 Lora,serif;color:#605d5d">{{ subtitle }}</span>
      </div>
      <button onClick="{{ openUnlock }}" style="flex:none;white-space:nowrap;height:30px;padding:0 10px;border:1px solid {{ tierBorder }};background:transparent;color:#7d5411;border-radius:15px;font:600 12px/1 Lora,serif;cursor:pointer;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums" style-hover="background:#fff3e4">
        <sc-if value="{{ isFree }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></sc-if>
        {{ tierLabel }}
      </button>
    </div>
    <label style="display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid rgba(32,31,29,.22);border-radius:4px;background:transparent">
      <svg width="18" height="18" viewBox="0 0 24 24" style="flex:none;fill:none;stroke:#7d7979;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input value="{{ query }}" onChange="{{ onQuery }}" placeholder="Cari judul artikel" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 15px Lora,serif;color:#201f1d">
      <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ clearQuery }}" aria-label="Hapus pencarian" style="width:28px;height:28px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:14px;color:#605d5d" style-hover="background:#eae9e9"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </sc-if>
    </label>
    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #201f1d">
      <button onClick="{{ openFilter }}" style="height:34px;padding:0 10px 0 12px;border:1px solid {{ filterBorder }};background:{{ filterBg }};color:#201f1d;border-radius:17px;font:400 13.5px Lora,serif;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="border-color:#b68235">
        {{ filterLabel }}
        <svg width="14" height="14" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <span style="font:600 11px/1 Lora,serif;letter-spacing:.1em;text-transform:uppercase;color:#605d5d;font-variant-numeric:tabular-nums">{{ countLabel }}</span>
    </div>
  </header>
  <main style="flex:1;overflow-y:auto;padding-bottom:110px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
      <div onClick="{{ r.tap }}" onPointerDown="{{ r.down }}" onPointerUp="{{ r.cancel }}" onPointerLeave="{{ r.cancel }}" onContextMenu="{{ r.context }}" style="display:flex;gap:4px;padding:16px 8px 16px 20px;border-bottom:1px solid rgba(32,31,29,.16);cursor:pointer;user-select:none;opacity:{{ r.opacity }}" style-hover="background:#eae9e9" style-active="background:#e2dfdf">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
          <span style="font:600 10.5px/1 Lora,serif;letter-spacing:.12em;text-transform:uppercase;color:#7d5411">{{ r.gameName }}</span>
          <span style="font:600 21px/1.18 'Cormorant Garamond',serif;letter-spacing:-.005em;text-wrap:pretty">{{ r.title }}</span>
          <sc-if value="{{ r.isReady }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font:400 13px/1.3 Lora,serif;color:#605d5d;font-variant-numeric:tabular-nums">{{ r.meta }}</span>
              <sc-if value="{{ r.isPartial }}" hint-placeholder-val="{{ false }}">
                <span style="height:20px;padding:0 7px;border:1px solid #c98a7e;color:#9e3b2c;border-radius:10px;font:600 10.5px/18px Lora,serif;font-variant-numeric:tabular-nums">{{ r.partialLabel }}</span>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ r.isScraping }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:7px">
              <div style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#b68235;animation:qlPulse 1.2s ease-in-out infinite"></span><span style="font:400 13px/1.3 Lora,serif;color:#7d5411;font-variant-numeric:tabular-nums">{{ r.progressLabel }}</span></div>
              <div style="height:2px;background:#d7d3d3;border-radius:1px;overflow:hidden;max-width:220px"><div style="height:100%;width:{{ r.pct }};background:#b68235;transition:width .5s ease"></div></div>
            </div>
          </sc-if>
          <sc-if value="{{ r.isError }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#9e3b2c"></span><span style="font:400 13px/1.3 Lora,serif;color:#9e3b2c">Gagal — tap untuk retry</span></div>
          </sc-if>
          <sc-if value="{{ r.hasCheckpoint }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ r.resume }}" style="align-self:flex-start;margin-top:5px;height:32px;padding:0 12px 0 10px;border:1px solid #b68235;background:transparent;color:#7d5411;border-radius:4px;font:600 12.5px Lora,serif;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="background:#fff3e4" style-active="background:#ffe3bf">
              <svg width="14" height="14" viewBox="0 0 24 24" style="fill:#e1ad66;stroke:#a06f24;stroke-width:1.6;stroke-linejoin:round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
              Lanjutkan Baca
            </button>
          </sc-if>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:space-between">
          <button onClick="{{ r.more }}" aria-label="Aksi artikel" style="width:40px;height:40px;border:none;background:transparent;border-radius:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#605d5d" style-hover="background:#e2dfdf"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:currentColor"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg></button>
          <sc-if value="{{ r.isReady }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" style="margin-bottom:6px;fill:none;stroke:#9b9797;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="m9 18 6-6-6-6"></path></svg></sc-if>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="padding:64px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px">
        <span style="font:500 24px/1.2 'Cormorant Garamond',serif">{{ emptyTitle }}</span>
        <span style="font:400 14px/1.5 Lora,serif;color:#605d5d;text-wrap:pretty">{{ emptyBody }}</span>
      </div>
    </sc-if>
  </main>
  <button onClick="{{ add }}" aria-label="Simpan walkthrough baru" style="position:absolute;right:20px;bottom:28px;width:60px;height:60px;border-radius:30px;border:1px solid #b68235;background:#f3f2f2;color:#a06f24;box-shadow:0 3px 10px rgba(45,43,43,.16);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:#fff3e4" style-active="background:#ffe3bf">
    <svg width="26" height="26" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
  </button>
  <sc-if value="{{ hasSnack }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:16px;right:92px;bottom:32px;min-height:48px;padding:12px 16px;box-sizing:border-box;background:#2d2b2b;color:#f3f2f2;border-radius:4px;font:400 13.5px/1.4 Lora,serif;box-shadow:0 3px 10px rgba(45,43,43,.2);animation:qlUp .22s ease-out">{{ snack }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;games&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Game[]&quot;},&quot;articles&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Article[]&quot;},&quot;isPremium&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;query&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;filterGameId&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number|null&quot;},&quot;snackbar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string|null&quot;},&quot;onQuery&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;},&quot;onOpenFilter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onArticleTap&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(a:Article)=&gt;void&quot;},&quot;onResume&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(a:Article)=&gt;void&quot;},&quot;onOpenActions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(a:Article)=&gt;void&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onOpenUnlock&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { query: '', filter: null, snack: null };
  static sample() {
    const pg = (n, st = 'DONE', from = 0) => Array.from({ length: n }, (_, i) => ({ url: 'https://gamefaqs.gamespot.com/ps/dq7/faqs/walkthrough?page=' + (i + 1 + from), status: typeof st === 'function' ? st(i) : st }));
    return {
      games: [{ id: 1, name: 'Dragon Quest VII' }, { id: 2, name: 'Breath Of Fire III' }],
      articles: [
        { id: 3, gameId: 1, title: 'Panduan Class & Monster Heart', status: 'SCRAPING', pages: pg(6, i => i < 2 ? 'DONE' : 'PENDING') },
        { id: 1, gameId: 1, title: 'Walkthrough Lengkap — Disc 1', status: 'READY', pages: pg(5), checkpointNodeId: 302, lastRead: 'dibaca 2 jam lalu' },
        { id: 2, gameId: 1, title: 'Lokasi Semua Mini Medal', status: 'READY', pages: pg(4, i => i === 2 ? 'FAILED' : 'DONE'), lastRead: 'dibaca kemarin' },
        { id: 4, gameId: 2, title: 'Walkthrough Utama', status: 'READY', pages: pg(5), checkpointNodeId: 103, lastRead: 'dibaca 3 hari lalu' },
        { id: 5, gameId: 2, title: 'Master & Skill List', status: 'ERROR', pages: pg(2, 'FAILED') }
      ]
    };
  }
  componentWillUnmount() { clearTimeout(this.lp); clearTimeout(this.st); }
  toast(t) { clearTimeout(this.st); this.setState({ snack: t }); this.st = setTimeout(() => this.setState({ snack: null }), 2600); }
  renderVals() {
    const p = this.props, s = Component.sample();
    const games = p.games || s.games, articles = p.articles || s.articles;
    const isPremium = p.isPremium ?? false;
    const query = p.query ?? this.state.query;
    const filter = p.filterGameId !== undefined ? p.filterGameId : this.state.filter;
    const q = query.trim().toLowerCase();
    const gname = id => (games.find(g => g.id === id) || {}).name || '—';
    const list = articles.filter(a => (filter == null || a.gameId === filter) && (!q || a.title.toLowerCase().includes(q)));
    const tapArticle = a => {
      if (p.onArticleTap) return p.onArticleTap(a);
      if (a.status === 'SCRAPING') this.toast('Artikel masih diproses, harap tunggu');
      else if (a.status === 'ERROR') this.toast('Membuka dialog retry / hapus');
      else this.toast('Membuka Reader');
    };
    const rows = list.map(a => {
      const tot = a.pages.length, done = a.pages.filter(x => x.status === 'DONE').length, fail = a.pages.filter(x => x.status === 'FAILED').length;
      const handled = tot - a.pages.filter(x => x.status === 'PENDING' || x.status === 'IN_PROGRESS').length;
      const stop = e => e && e.stopPropagation && e.stopPropagation();
      const openActions = () => p.onOpenActions ? p.onOpenActions(a) : this.toast('Membuka aksi artikel');
      return {
        id: a.id, title: a.title, gameName: gname(a.gameId),
        isReady: a.status === 'READY', isScraping: a.status === 'SCRAPING' || a.status === 'PENDING', isError: a.status === 'ERROR',
        isPartial: a.status === 'READY' && fail > 0, partialLabel: fail + ' halaman gagal',
        meta: (fail ? done + '/' + tot : tot) + ' halaman' + (a.lastRead ? ' · ' + a.lastRead : ' · belum dibaca'),
        progressLabel: 'Memproses… ' + handled + '/' + tot, pct: Math.round(handled / tot * 100) + '%',
        hasCheckpoint: a.status === 'READY' && !!a.checkpointNodeId,
        opacity: a.status === 'SCRAPING' ? '.85' : '1',
        tap: () => { if (this.longFired) { this.longFired = false; return; } tapArticle(a); },
        down: () => { this.longFired = false; clearTimeout(this.lp); this.lp = setTimeout(() => { this.longFired = true; openActions(); }, 520); },
        cancel: () => clearTimeout(this.lp),
        context: e => { e.preventDefault(); },
        more: e => { stop(e); openActions(); },
        resume: e => { stop(e); p.onResume ? p.onResume(a) : this.toast('Lanjut ke checkpoint'); }
      };
    });
    const fg = filter == null ? null : games.find(g => g.id === filter);
    const setQ = v => p.onQuery ? p.onQuery(v) : this.setState({ query: v });
    return {
      subtitle: articles.length + ' walkthrough · tersedia offline',
      isFree: !isPremium,
      tierLabel: isPremium ? 'Unlimited' : games.length + '/2 game',
      tierBorder: isPremium ? '#b68235' : 'rgba(182,130,53,.55)',
      openUnlock: () => p.onOpenUnlock ? p.onOpenUnlock() : this.toast('Membuka Unlock Unlimited'),
      query, hasQuery: !!query, onQuery: e => setQ(e.target.value), clearQuery: () => setQ(''),
      filterLabel: fg ? fg.name : 'Semua Game',
      filterBorder: fg ? '#b68235' : 'rgba(32,31,29,.22)', filterBg: fg ? '#fff3e4' : 'transparent',
      openFilter: () => p.onOpenFilter ? p.onOpenFilter() : this.setState({ filter: filter == null ? games[0].id : null }),
      countLabel: rows.length + ' artikel',
      rows, isEmpty: rows.length === 0,
      emptyTitle: articles.length ? 'Tidak ada yang cocok' : 'Belum ada walkthrough',
      emptyBody: articles.length ? 'Coba kata kunci lain atau tampilkan semua game.' : 'Tap ＋ untuk menyimpan walkthrough pertama. Kontennya bisa dibaca tanpa internet.',
      add: () => p.onAdd ? p.onAdd() : this.toast('Membuka pilihan simpan walkthrough'),
      hasSnack: !!(p.snackbar || this.state.snack), snack: p.snackbar || this.state.snack
    };
  }
}
</script>
</body>
</html>
