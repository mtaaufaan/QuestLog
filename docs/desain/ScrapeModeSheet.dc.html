<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono&display=swap"><style>body{margin:0;background:#f3f2f2;color:#201f1d;font-family:Lora,serif}a{color:#7d5411}a:hover{color:#5a3b0a}button{font:inherit}@keyframes qlFade{from{opacity:0}to{opacity:1}}@keyframes qlSheet{from{transform:translateY(100%)}to{transform:none}}</style></helmet>
<div data-screen-label="Popup Scrape Mode" style="position:relative;width:100%;height:100%;min-height:844px;display:flex;flex-direction:column;justify-content:flex-end;font-family:Lora,serif;color:#201f1d;overflow:hidden">
  <div onClick="{{ close }}" style="position:absolute;inset:0;background:rgba(20,19,18,.45);animation:qlFade .2s ease-out"></div>
  <div style="position:relative;background:#f3f2f2;border-radius:12px 12px 0 0;padding:10px 20px 26px;box-shadow:0 -12px 32px rgba(45,43,43,.22);animation:qlSheet .28s cubic-bezier(.2,.8,.2,1)">
    <div style="width:36px;height:4px;border-radius:2px;background:#bab6b6;margin:0 auto 20px"></div>
    <div style="padding:0 4px 16px;display:flex;flex-direction:column;gap:4px">
      <span style="font:600 10.5px/1 Lora,serif;letter-spacing:.12em;text-transform:uppercase;color:#7d5411">Simpan walkthrough</span>
      <h2 style="margin:0;font:600 26px/1.15 'Cormorant Garamond',serif">Mau menyimpan apa?</h2>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button onClick="{{ pickNew }}" style="display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border:1px solid rgba(32,31,29,.16);border-radius:6px;background:transparent;color:inherit;cursor:pointer" style-hover="border-color:#b68235;background:#fff3e4">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex:none;margin-top:2px;fill:none;stroke:#a06f24;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M9 15h6"></path><path d="M12 18v-6"></path></svg>
        <span style="display:flex;flex-direction:column;gap:3px;flex:1">
          <span style="font:600 16px/1.3 Lora,serif">Buat artikel baru</span>
          <span style="font:400 13.5px/1.45 Lora,serif;color:#605d5d">Isi judul, pilih game, lalu masukkan satu atau beberapa URL. Urutan URL bisa diatur.</span>
        </span>
      </button>
      <button onClick="{{ pickAppend }}" disabled="{{ appendDisabled }}" style="display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border:1px solid rgba(32,31,29,.16);border-radius:6px;background:transparent;color:inherit;cursor:pointer" style-hover="border-color:#b68235;background:#fff3e4" style-disabled="opacity:.45;cursor:default">
        <svg width="22" height="22" viewBox="0 0 24 24" style="flex:none;margin-top:2px;fill:none;stroke:#a06f24;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path><path d="M12 7v6"></path><path d="M9 10h6"></path></svg>
        <span style="display:flex;flex-direction:column;gap:3px;flex:1">
          <span style="font:600 16px/1.3 Lora,serif">Lengkapi artikel yang ada</span>
          <span style="font:400 13.5px/1.45 Lora,serif;color:#605d5d">Tambah halaman lanjutan ke artikel tersimpan. Halaman baru selalu ditaruh di akhir.</span>
        </span>
      </button>
    </div>
    <button onClick="{{ close }}" style="margin-top:14px;width:100%;height:46px;border:none;background:transparent;color:#605d5d;font:600 14px Lora,serif;cursor:pointer;border-radius:4px" style-hover="background:#eae9e9">Batal</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;hasArticles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(mode:'new'|'append')=&gt;void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      pickNew: () => p.onPick && p.onPick('new'),
      pickAppend: () => p.onPick && p.onPick('append'),
      appendDisabled: p.hasArticles === false,
      close: () => p.onClose && p.onClose()
    };
  }
}
</script>
</body>
</html>
